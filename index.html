<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Count Ludo — Play Ludo Online Free, No Ads</title>
    <meta
      name="description"
      content="Play Ludo online free. Count Ludo is a clean, ad-free Ludo game for your browser: race friends locally or take on smart bots. No downloads, no signup."
    />
    <meta
      name="keywords"
      content="ludo, play ludo online, ludo online free, ludo game, free ludo, ludo no ads, ludo vs computer, multiplayer ludo, browser ludo"
    />
    <meta name="theme-color" content="#fdfcfb" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://count-ludo.pages.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- iOS: proper standalone "Add to Home Screen" (Safari ignores the web
         manifest for this, it needs its own meta tags). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Count Ludo" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Count Ludo — Play Ludo Online Free, No Ads"
    />
    <meta
      property="og:description"
      content="A clean, ad-free Ludo game for your browser. Play free vs smart bots or friends on one device. No downloads, no signup."
    />
    <meta property="og:url" content="https://count-ludo.pages.dev/" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Count Ludo — Play Ludo Online Free" />
    <meta
      name="twitter:description"
      content="Clean, ad-free Ludo in your browser. Free forever."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data helps search engines understand this is a playable game -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Count Ludo",
        "url": "https://count-ludo.pages.dev/",
        "description": "Play Ludo online free. A clean, ad-free browser Ludo game against bots or local friends.",
        "genre": ["Board game", "Strategy"],
        "applicationCategory": "Game",
        "operatingSystem": "Any (web browser)",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <!-- Static first paint: real content for crawlers and instant load; the app
         replaces it on boot. -->
    <div id="app">
      <main class="home">
        <section class="hero">
          <h1>Count Ludo</h1>
          <p class="tagline">
            Ludo, online and clean. Roll, race, win. No ads, no downloads.
          </p>
          <p class="lede">
            Play Ludo online free, right in your browser, against smart bots or
            friends passing one device. No signup, no installs, no nagging. Just
            the classic race to get all four tokens home, the way it should be.
          </p>
        </section>
      </main>
    </div>
    <noscript>
      <p style="text-align: center; padding: 2rem">
        Count Ludo is a browser game and needs JavaScript enabled to play. It
        runs entirely on your device: no data is ever sent anywhere.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
