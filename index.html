<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta property="og:type" content="website" />

      name="twitter:description"
      content="Clean, ad-free Ludo in your browser. Free forever."
    />
    <meta
      name="twitter:image"
      content="https://count-ludo.pages.dev/og-image.png"
    />

    <!-- Structured data (Organization, WebSite, SoftwareApplication) is
         generated from src/site/content.ts by the build plugin. -->
    <!--site:jsonld-->
  </head>

    <script type="module" src="/src/main.ts"></script>
